    @import url('https://fonts.googleapis.com/css2?family=Libre+Baskerville:wght@400;700&display=swap');

    body {
      font-family: 'Helvetica W01 Light', 'Helvetica Neue', Helvetica, Arial, sans-serif;

      padding: 0;
      overflow-x: hidden;
      letter-spacing: 0.9px;
    }

    #about p, #team p{ text-align:justify; }

    }

      }

    }

    .arrow-icon {
      width: 48px;
      height: 14px;
      margin-right: 16px;
    }

    /* Soft Menu Background Slide */
    .menu-bg-slide {
      background: linear-gradient(to right, rgba(255,255,255,1) 90%, rgba(255,255,255,0) 100%);
    }

    /* Hamburger to X Animation styles */
    .hamburger-line {
      transition: transform 0.4s ease, opacity 0.3s ease, background-color 0.3s ease;
    }

    /* Partner Pill Selector */
    .partner-pill {
      display: flex;
      align-items: center;
      gap: 10px;
      background-color: rgba(255,255,255,0.85);
      border: 1px solid #e5e7eb;
      border-radius: 999px;
      padding: 6px 18px 6px 6px;
      cursor: pointer;
      transition: border-color 0.25s ease, box-shadow 0.25s ease, transform 0.25s ease, background-color 0.25s ease;
    }
    .partner-pill:hover {
      border-color: #E13A44;
      transform: translateY(-1px);
      box-shadow: 0 6px 14px rgba(0,0,0,0.06);
    }
    .partner-pill.active {
      border-color: #E13A44;
      background-color: #ffffff;
      box-shadow: 0 6px 16px rgba(225,58,68,0.15);
    }
    .partner-pill img {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      object-fit: cover;
      object-position: top center;
      border: 2px solid #e5e7eb;
      transition: border-color 0.25s ease;
      flex-shrink: 0;
    }
    .partner-pill.active img {
      border-color: #E13A44;
    }
    .partner-pill .pill-name {
      font-size: 13px;
      font-weight: bold;
      color: #333333;
      line-height: 1.2;
      white-space: nowrap;
    }
    .partner-pill .pill-role {
      font-size: 10px;
      color: #9CA3AF;
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }
    .partner-pill.active .pill-role {
      color: #E13A44;
    }

    /* Detail Panels for Partners and Counsels */
    #partnerDetail, #counselDetail {
      opacity: 1;
      transition: opacity 0.3s ease;
    }
    #partnerDetail.fading, #counselDetail.fading {
      opacity: 0;
    }
    .partner-photo-frame {
      background-color: #ffffff;
      border: 1px solid #e5e7eb;
      border-radius: 10px;
      padding: 8px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.06);
    }
    .partner-photo-frame img {
      width: 100%;
      height: 320px;
      object-fit: cover;
      object-position: top center;
      border-radius: 6px;
      display: block;
    }
    .partner-contact-btn {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      font-size: 13px;
      font-weight: bold;
      padding: 10px 14px;
      border-radius: 999px;
      border: 1px solid #e5e7eb;
      background-color: #ffffff;
      transition: border-color 0.2s ease, background-color 0.2s ease, color 0.2s ease;
    }
    .partner-contact-btn.linkedin { color: #0A66C2; }
    .partner-contact-btn.linkedin:hover { border-color: #0A66C2; background-color: rgba(10,102,194,0.06); }
    .partner-contact-btn.email { color: #E13A44; }
    .partner-contact-btn.email:hover { border-color: #E13A44; background-color: rgba(225,58,68,0.06); }

    /* Scroll Reveal Animation */
    .reveal-on-scroll {
      opacity: 0;
      transform: translateY(40px);
      transition: opacity 1.8s cubic-bezier(0.25, 1, 0.5, 1), transform 1.8s cubic-bezier(0.25, 1, 0.5, 1);
      will-change: opacity, transform;
    }
    .reveal-on-scroll.is-visible {
      opacity: 1;
      transform: translateY(0);
    }
  </style>
</head>

  <!-- Scripts for Interactivity -->
  <script>
    // Initialize Scroll Animations
    function initScrollAnimations() {
        const observerOptions = {
            root: null,
            rootMargin: '0px',
            threshold: 0.15 // Trigger when 15% of the element is visible
        };

        const observer = new IntersectionObserver((entries, observer) => {
            entries.forEach(entry => {
                if (entry.isIntersecting) {
                    entry.target.classList.add('is-visible');
                    observer.unobserve(entry.target); // Stop observing once revealed
                }
            });
        }, observerOptions);

        const revealElements = document.querySelectorAll('.reveal-on-scroll');
        revealElements.forEach(el => observer.observe(el));
    }

    const body = document.body;
    body.classList.remove('overflow-hidden');
    initScrollAnimations();

    // 1. Mobile Menu Toggle Logic
    const menuToggleBtn = document.getElementById('menuToggleBtn');
    const line1 = document.getElementById('line1');
    const line2 = document.getElementById('line2');
    const line3 = document.getElementById('line3');
    
    const mobileMenuBg = document.getElementById('mobileMenuBg');
    const mobileMenuContent = document.getElementById('mobileMenuContent');
    const mobileLinks = document.querySelectorAll('.mobile-link');

    let isMenuOpen = false;

    function toggleMenu() {
      isMenuOpen = !isMenuOpen;
      
      if (isMenuOpen) {
        // Animate hamburger to X
        line1.style.transform = 'translateY(0) rotate(45deg)';
        line2.style.opacity = '0';
        line3.style.transform = 'translateY(0) rotate(-45deg)';
        line1.classList.replace('bg-gray-800', 'bg-brand-red');
        line3.classList.replace('bg-gray-800', 'bg-brand-red');

        // Slide in background
        mobileMenuBg.classList.remove('hidden'); 
        requestAnimationFrame(() => {
            mobileMenuBg.classList.remove('translate-x-full');
            mobileMenuBg.classList.add('translate-x-0');
        });

        // Fade in content
        mobileMenuContent.classList.remove('hidden');
        setTimeout(() => {
            mobileMenuContent.classList.remove('opacity-0', 'pointer-events-none');
            mobileMenuContent.classList.add('opacity-100', 'pointer-events-auto');
        }, 150);

      } else {
        // Animate X back to hamburger
        line1.style.transform = 'translateY(-8px) rotate(0)';
        line2.style.opacity = '1';
        line3.style.transform = 'translateY(8px) rotate(0)';
        line1.classList.replace('bg-brand-red', 'bg-gray-800');
        line3.classList.replace('bg-brand-red', 'bg-gray-800');

        // Fade out content
        mobileMenuContent.classList.remove('opacity-100', 'pointer-events-auto');
        mobileMenuContent.classList.add('opacity-0', 'pointer-events-none');
        
        // Slide out background
        mobileMenuBg.classList.remove('translate-x-0');
        mobileMenuBg.classList.add('translate-x-full');

        // Hide entirely after animation completes
        setTimeout(() => {
            mobileMenuContent.classList.add('hidden');
        }, 800);
      }
    }

    menuToggleBtn.addEventListener('click', toggleMenu);

    mobileLinks.forEach(link => {
      link.addEventListener('click', () => {
        if (isMenuOpen) toggleMenu();
      });
    });
  </script>

        img: 'img/kaushik.jpeg',

        ],

        name: 'Harshdeep Singh',
        role: 'Partner',
        img: 'img/singh.jpeg',
        bio: [
          "Harshdeep Singh advises on banking and finance, infrastructure and corporate transactions. His experience spans the development, financing, implementation, operation and maintenance of infrastructure projects, supporting clients throughout the project lifecycle."

        linkedin: '#',
        email: '#'
      }
    ];

    const pillsContainer = document.getElementById('partnerPills');
    const detailContainer = document.getElementById('partnerDetail');
    let activePartnerId = partners[0].id;

    function renderPills() {
      pillsContainer.innerHTML = partners.map(p => `
        <button type="button" class="partner-pill${p.id === activePartnerId ? ' active' : ''}" data-id="${p.id}" aria-label="View ${p.name}">

            <span class="pill-role block">${p.role}</span>

      pillsContainer.querySelectorAll('.partner-pill').forEach(btn => {
        btn.addEventListener('click', () => selectPartner(btn.getAttribute('data-id')));
      });
    }

    function renderDetail(partner) {
      detailContainer.innerHTML = `
        <div class="lg:col-span-2">
          <span class="inline-block text-[11px] font-bold uppercase tracking-[0.15em] brand-red bg-white border border-red-100 rounded-full px-4 py-1 mb-5">${partner.role}</span>

        <div class="flex flex-col gap-4">

          <div class="flex gap-3">

          </div>
        </div>
      `;
    }

    function selectPartner(id) {
      if (id === activePartnerId) return;
      activePartnerId = id;
      renderPills();
      detailContainer.classList.add('fading');
      setTimeout(() => {
        renderDetail(partners.find(p => p.id === id));
        detailContainer.classList.remove('fading');
      }, 200);
    }

    renderPills();
    renderDetail(partners[0]);

        name: 'Navarre Roy',
        role: 'Special Counsel',
        subRole: 'Intellectual Property Rights',

            <span class="pill-role block">Special Counsel</span>

    function renderCounselDetail(counsel) {
